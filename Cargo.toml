[package]
name = "weight-tracker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Logging, traces, metrics, serving, the Access allowlist and the heap
# profile, named as the homelab dashboards read them.
homelab = { git = "https://github.com/jchevertonwynne/homelab-rs", tag = "v0.5.0" }
axum = { version = "0.8", default-features = false, features = ["http1", "matched-path", "multipart", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
# The pool, and through it rusqlite, bundled: the SQLite is the one this build
# was tested against, and there is no base image to carry one — FROM scratch.
r2d2 = "0.8"
r2d2_sqlite = { version = "0.35", features = ["bundled"] }
# The schema steps, versioned by PRAGMA user_version.
rusqlite_migration = "2.6"
askama = "0.16"
# Embedded static files, served with ETags. build.rs loads them at compile
# time.
memory-serve = { version = "2", features = ["force-embed"] }
# Local wall-clock time is the whole domain here: the morning/evening split,
# day boundaries and calendar arithmetic all happen in the zone TZ names.
# homelab-rs already bundles the zone database, so it resolves on scratch.
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
regex = "1"
form_urlencoded = "1"
percent-encoding = "2"
subtle = "2"
tempfile = "3"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
memory-serve = { version = "2", features = ["force-embed"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.clippy]
# Handlers return the refusal itself — a 400, a 404 — as Err(Response), the
# usual axum early return. Boxing every one would buy nothing.
result_large_err = "allow"

[profile.release]
# The symbol table stays: the heap profile names functions from it, and a
# stripped binary's flame graph is a wall of addresses.
strip = "debuginfo"
