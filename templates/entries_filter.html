<section class="card">
	<h2>Filter</h2>
	<form id="entries-filter" class="chart-controls"
		hx-get="/entries"
		hx-target="#entries-list"
		hx-swap="outerHTML"
		hx-trigger="change, time-passed[!document.querySelector('.entry-row-editing')] from:body">
		{#- time-passed (see static/app.js) re-renders the list so its
		    "Today"/"Yesterday" labels follow the clock, but not over a row
		    that is mid-edit, which would throw away the unsaved change. #}
		<div class="chart-controls-row">
			<label class="field">
				<span>Period</span>
				<select name="period" autocomplete="off">
					<option value="" selected>All</option>
					<option value="morning">Morning</option>
					<option value="evening">Evening</option>
				</select>
			</label>
			{% let picker = history_range %}{% include "time_range_picker.html" %}
		</div>
	</form>
</section>
