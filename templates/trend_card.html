{{define "trend-card"}}
<section class="card" id="trend-card">
	<h2>Trend</h2>
	<form id="chart-controls" class="chart-controls">
		<div class="chart-controls-row">
			{{template "time-range-picker" .ChartRange}}
			<label class="field">
				<span>Series</span>
				<select name="series" autocomplete="off">
					<option value="morning" selected>Morning only</option>
					<option value="evening">Evening only</option>
					<option value="morning-delta">Morning deltas</option>
					<option value="evening-delta">Evening deltas</option>
					<option value="overnight">Overnight change</option>
					<option value="daily">Daily change</option>
					<option value="all">All weigh-ins</option>
				</select>
			</label>
		</div>
		<div class="chart-controls-row">
			<label class="field field-checkbox">
				<input type="checkbox" name="show-raw" checked autocomplete="off">
				<span>Show raw data</span>
			</label>
			<label class="field field-checkbox">
				<input type="checkbox" name="show-trend" checked autocomplete="off">
				<span>Show trend line</span>
			</label>
		</div>
	</form>
	<canvas id="weight-chart"></canvas>
	<p class="empty" id="chart-empty" hidden></p>
	<p class="empty" id="marker-note" hidden></p>
	{{/* Populated by chart-app.js from the same markers the chart draws,
	     so it always lists exactly what is on the plot. The inline labels
	     get dropped when dates crowd together; this does not. */}}
	<ul class="marker-legend" id="marker-legend" aria-label="Markers on this chart" hidden></ul>
</section>
{{end}}
