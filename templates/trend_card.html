{{define "trend-card"}}
<section class="card" id="trend-card">
	<h2>Trend</h2>
	<form id="chart-controls" class="chart-controls">
		<div class="chart-controls-row">
			<label class="field">
				<span>Range</span>
				<select name="range">
					<option value="7">Last 7 days</option>
					<option value="30" selected>Last 30 days</option>
					<option value="90">Last 90 days</option>
					<option value="365">Last year</option>
					<option value="all">All time</option>
					<option value="custom">Custom range</option>
				</select>
			</label>
			<label class="field">
				<span>Series</span>
				<select name="series">
					<option value="all" selected>All weigh-ins</option>
					<option value="morning">Morning only</option>
					<option value="evening">Evening only</option>
					<option value="morning-delta">Morning deltas</option>
					<option value="evening-delta">Evening deltas</option>
				</select>
			</label>
		</div>
		<div class="chart-controls-row" id="custom-range-row" hidden>
			<label class="field">
				<span>From</span>
				<input type="date" name="from" id="custom-range-from">
			</label>
			<label class="field">
				<span>Until</span>
				<input type="date" name="until" id="custom-range-until">
			</label>
		</div>
		<div class="chart-controls-row">
			<label class="field field-checkbox">
				<input type="checkbox" name="show-raw" checked>
				<span>Show raw data</span>
			</label>
			<label class="field field-checkbox">
				<input type="checkbox" name="show-trend" checked>
				<span>Show trend line</span>
			</label>
		</div>
	</form>
	<canvas id="weight-chart"></canvas>
	<p class="empty" id="chart-empty" hidden></p>
	<p class="empty" id="marker-note" hidden></p>
</section>
{{end}}
