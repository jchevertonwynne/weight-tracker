<div class="entry-row" id="goal-{{ row.goal.id }}">
	<div class="entry-main">
		{% if row.current %}<span class="chip chip-goal-current">Current</span>{% endif %}
		<span class="entry-weight">{{ row.goal.weight }} kg</span>
		<span class="entry-date">from {{ row.goal.effective_from.date_label() }}</span>
	</div>
	<div class="entry-actions">
		<button class="btn-text" hx-get="/goals/{{ row.goal.id }}/edit" hx-target="#goal-{{ row.goal.id }}" hx-swap="outerHTML">Edit</button>
		<button class="btn-text btn-danger" hx-delete="/goals/{{ row.goal.id }}" hx-target="#goals-list" hx-swap="outerHTML" hx-confirm="Delete this goal?">Delete</button>
	</div>
</div>
