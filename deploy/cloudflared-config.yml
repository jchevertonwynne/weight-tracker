# cloudflared config for the Pi. Install to /etc/cloudflared/config.yml.
#
# This is a locally-managed tunnel: the ingress rules live here rather than
# in the Cloudflare dashboard, so a change to what is exposed is a
# reviewable diff. The trade-off is that the dashboard shows no ingress
# config for this tunnel — the Pi is the source of truth.
#
# `cloudflared tunnel create` prints the UUID both fields below need, and
# writes the credentials file it names. See the README.

tunnel: TUNNEL_UUID
credentials-file: /home/jcw/.cloudflared/TUNNEL_UUID.json

# Cloudflare terminates TLS at the edge, so the origin is plain HTTP on
# loopback. That hop stays inside the Pi; the tunnel out to Cloudflare is
# an outbound QUIC connection authenticated by the credentials file above.
# Nothing listens on a public port.
ingress:
  - hostname: weight.jchevertonwynne.uk
    service: http://localhost:8090

  # Everything else is refused. Deliberately no rule for Pi-hole on :8080 —
  # reach that over Tailscale. A catch-all must come last or cloudflared
  # refuses to start.
  - service: http_status:404
