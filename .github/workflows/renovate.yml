name: Renovate

# Self-hosted rather than the GitHub App: no install to manage.
#
# This cron is the only schedule. renovate.json used to carry its own,
# "before 6am on monday", and the two never met: GitHub starts scheduled runs
# late, these ones between 09:55 and 11:25 UTC, so every run found itself
# outside Renovate's window and opened nothing. Eight weekly runs went green
# while the Dependency Dashboard filled up with "Awaiting Schedule". Do not add
# a schedule back to renovate.json; move this cron instead.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v46.2.4
        with:
          # RENOVATE_TOKEN, when set, is a fine-grained PAT on this repository
          # with Contents, Pull requests, Issues and Workflows: Read and write.
          # GITHUB_TOKEN works without it but has two blind spots: GitHub
          # refuses it any change under .github/workflows/, so action bumps
          # cannot be pushed, and a PR it opens does not trigger CI, so every
          # other bump arrives with no checks run on it.
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: info
