name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — no point finishing a
# run for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track the toolchain the module already declares, so bumping Go
          # is a one-line change in go.mod rather than two.
          go-version-file: go.mod
          cache: true

      # vendor/ is excluded: gofmt recurses into directory arguments, so a bare
      # `gofmt -l .` reports the vendored dependencies, which are not ours to
      # format.
      - name: gofmt
        run: |
          files=$(find . -name '*.go' -not -path './vendor/*')
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d $files
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # No `go mod tidy` check here any more. tidy always resolves the full
      # module graph over the network, ignoring vendor/, and homelab-go is a
      # private repo - so this step would fail in Actions with no credential,
      # which is the thing vendoring exists to avoid. Consistency is still
      # enforced: every `go build`/`go vet`/`go test` below runs in vendor mode
      # and fails outright if vendor/modules.txt disagrees with go.mod.
      - name: Test
        run: go test -race -cover ./...

      # The app reads and writes local wall-clock times, and its
      # morning/evening split hinges on a 4am boundary. The runner is UTC, so
      # re-run the suite under offsets that would expose a timezone
      # assumption — including a half-hour and a 45-minute offset.
      # -count=1 is essential: Go's test cache does not key on TZ, so without
      # it every zone after the first returns a cached pass and this step
      # silently checks nothing.
      - name: Test in other timezones
        run: |
          for tz in Europe/London America/New_York Australia/Sydney Asia/Kathmandu; do
            echo "::group::TZ=$tz"
            TZ=$tz go test -count=1 ./... || exit 1
            echo "::endgroup::"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # Kept in step with the Makefile's own pin by the check below, so a
      # local 'make lint' and this job can never apply different rules.
      GOLANGCI_LINT_VERSION: v2.13.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pinned linter version matches the Makefile
        run: |
          pinned=$(sed -n 's/^GOLANGCI_LINT_VERSION := //p' Makefile)
          if [ "$pinned" != "$GOLANGCI_LINT_VERSION" ]; then
            echo "Makefile pins golangci-lint $pinned, this workflow pins $GOLANGCI_LINT_VERSION."
            echo "Bump both together."
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build for this host
        run: go build ./...

      # The whole point of the pure-Go SQLite driver is that the Raspberry Pi
      # targets cross-compile without a toolchain — verify that stays true.
      - name: Cross-compile for Raspberry Pi
        run: |
          GOOS=linux GOARCH=arm64 go build -o /tmp/weight-tracker-arm64 .
          GOOS=linux GOARCH=arm GOARM=6 go build -o /tmp/weight-tracker-armv6 .
