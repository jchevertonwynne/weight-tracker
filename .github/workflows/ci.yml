name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — no point finishing a
# run for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same three steps as `make check`, so a green run locally means a green
  # run here. ubuntu-latest ships a stable toolchain with rustfmt and clippy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      # The app reads and writes local wall-clock times, and its
      # morning/evening split hinges on a 4am boundary. The runner is UTC, so
      # re-run the suite under offsets that would expose a timezone
      # assumption — including a half-hour and a 45-minute offset.
      - name: Test in other timezones
        run: |
          for tz in Europe/London America/New_York Australia/Sydney Asia/Kathmandu; do
            echo "::group::TZ=$tz"
            TZ=$tz cargo test --locked || exit 1
            echo "::endgroup::"
          done
