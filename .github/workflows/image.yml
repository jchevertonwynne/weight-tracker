name: Image

# Builds the container image the k3s cluster runs. The build itself lives in
# jchevertonwynne/workflows so every app shares one definition rather than a
# copy that drifts.

on:
  push:
    branches: [main]
    # No point rebuilding an image when only docs changed.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: jchevertonwynne/workflows/.github/workflows/build-image.yml@main
    permissions:
      contents: read
      packages: write
