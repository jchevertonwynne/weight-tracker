name: Image

# Builds the container image for the k3s cluster on the Pi.
#
# Deliberately a separate workflow from ci.yml rather than another job in it:
# during the migration the SSH-based deploy in ci.yml is still the live path,
# and pushing an image must not be able to break it. Once the cluster is
# serving, the deploy job in ci.yml goes away and this becomes the only route
# to production.

on:
  push:
    branches: [main]
    # No point rebuilding an image when only docs changed.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The Pi is arm64 and the runner is amd64. The Dockerfile cross-compiles
      # with Go's own toolchain (GOARCH=$TARGETARCH) rather than emulating the
      # whole build under QEMU, so this needs buildx for the platform plumbing
      # but not qemu — a Go cross-compile is far quicker than an emulated one.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # A moving 'main' tag for humans, plus an immutable sha tag that is
          # what the cluster manifest actually pins. Flux reconciling a moving
          # tag gives you no way to say which commit is running.
          tags: |
            type=raw,value=main
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "Pinned reference for the cluster manifest:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}"
